# Builds the app and uploads it to the Veebimajutus server on every push to main.
# Needs repo secrets SSH_HOST, SSH_USER and SSH_PRIVATE_KEY (see README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload over SFTP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: 1022
          DEPLOY_DIR: htdocs/korilus
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/deploy_key
          grep -q -- '-----BEGIN' ~/deploy_key || { echo "::error::SSH_PRIVATE_KEY is empty or missing its BEGIN line"; exit 1; }
          ssh-keygen -y -f ~/deploy_key > /dev/null || { echo "::error::SSH_PRIVATE_KEY is not a valid private key (or has a passphrase)"; exit 1; }
          ssh -i ~/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" true || { echo "::error::SSH login to $SSH_HOST:$SSH_PORT failed (see the ssh error above)"; exit 1; }
          # Mirror dist/ to the server, removing stale files but keeping what the
          # host manages: .well-known (Let's Encrypt renewals) and elkdata_* (redirects),
          # and the push subscriptions and key in api/data/ (listed both ways, as lftp may match the path or the name).
          lftp -e "set sftp:connect-program 'ssh -a -x -i $HOME/deploy_key -o StrictHostKeyChecking=accept-new'; \
            mirror --reverse --delete --verbose --exclude-glob .well-known/ --exclude-glob 'elkdata_*' --exclude-glob 'elkdata_*/' --exclude-glob api/data/ --exclude-glob data/ dist/ $DEPLOY_DIR/; bye" \
            -p "$SSH_PORT" -u "$SSH_USER," "sftp://$SSH_HOST"
