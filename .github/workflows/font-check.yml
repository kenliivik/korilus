name: Font check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          exec > out.txt 2>&1
          for u in https://dsgnr.ee/assets/index-B8OFOHyL.css https://dsgnr.ee/fonts/im-fell-double-pica.woff2 http://korilus.dsgnr.ee/ https://dsgnr.ee/; do
            echo "=== $u"; (curl -sS -m 20 -D - -o b.bin "$u" || true) | tr -d '\r' | grep -i "^HTTP\|^location\|^content-type\|^content-security"; head -c 300 b.bin | tr '\n' ' '; echo
          done
      - if: always()
        run: split -l 25 out.txt part_; for f in part_*; do echo "::notice::$(sed ':a;N;$!ba;s/\n/ ¦ /g' $f)"; done
