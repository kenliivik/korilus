name: Font diagnostic
on:
  push:
    branches: [claude/font-diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Headers
        run: |
          for u in https://korilus.dsgnr.ee/ https://korilus.dsgnr.ee/fonts/la-belle-aurore.woff2; do
            out=$(curl -sS --max-time 20 -D - -o /tmp/b "$u" 2>&1 | tr -d '\r' | tr '\n' '~')
            echo "::notice title=$u::$out"
          done
