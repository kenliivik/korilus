name: Font diagnostic
on:
  push:
    branches: [claude/font-diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Headers and hashes
        run: |
          base=https://korilus.dsgnr.ee
          for f in fonts/im-fell-double-pica-sc.woff2 fonts/la-belle-aurore.woff2; do
            h=$(curl -sS -D - -o /tmp/f -H 'Accept-Encoding: gzip, br' -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1' "$base/$f?x=1" | tr -d '\r' | grep -iE '^(HTTP|content-type|content-encoding|content-length|location|cache-control|access-control)' | tr '\n' ' ')
            echo "::notice title=$f::$h sha=$(sha256sum /tmp/f | cut -c1-12) size=$(stat -c%s /tmp/f) head=$(head -c4 /tmp/f | od -An -c | tr -d ' ')"
          done
          css=$(curl -sS "$base/" | grep -o '/assets/[^"]*\.css' | head -1)
          echo "::notice title=css::$css $(curl -sS "$base$css" | grep -o '@font-face{[^}]*}' | head -1)"
      - name: CSP headers
        run: |
          for u in https://korilus.dsgnr.ee/ https://korilus.dsgnr.ee/fonts/la-belle-aurore.woff2 https://dsgnr.ee/; do
            echo "::notice title=$u::$(curl -sS -D - -o /tmp/b "$u" | tr -d '\r' | grep -iE '^(content-security|x-|server|permissions|referrer)' | tr '\n' ' ') META=$(grep -io '<meta[^>]*security[^>]*>' /tmp/b)"
          done
