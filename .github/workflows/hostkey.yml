# Temporary: prints the deploy server's public SSH host keys so they can be pinned. Removed in the next commit.
name: Host key
on:
  push:
    branches: [claude/security-fixes]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: ssh-keyscan -p 1022 -t ed25519,ecdsa,rsa "$SSH_HOST" 2>/dev/null | cut -d' ' -f2- ; ssh-keyscan -p 1022 "$SSH_HOST" 2>/dev/null | ssh-keygen -lf - | cut -d' ' -f2,4
