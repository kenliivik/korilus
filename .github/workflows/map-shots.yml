# Temporary: map screenshots for the PR. Removed before merge.
name: Map shots
on:
  push:
    branches: [claude/botanical-map]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: |
          npx vite preview --port 4173 &
          sleep 3
          mkdir shots
          node .github/map-shots/shoot.mjs
          
      - run: |
          cd shots && git init -q -b map-shots && git add . && git -c user.name=bot -c user.email=bot@x commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" map-shots:claude/map-shots
