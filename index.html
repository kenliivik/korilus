    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iPhone launch screens (Android builds its own from the manifest). One per screen size, portrait only. -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1320x2868.jpg" />

    <title>Korilus</title>
    <!-- Loading screen: plain HTML and CSS so it shows on the first paint, before any JavaScript. src/loader.js hides it. -->
    <style>
      #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; padding: 2rem; background: #fdfbf0; color: #465940; font-family: "IM Fell Double Pica", Georgia, serif; text-align: center; transition: opacity 0.35s ease; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .sprigs { display: flex; align-items: flex-end; gap: 0.5rem; height: 96px; }
      #loader .sprigs img { height: 90px; width: auto; transform-origin: 50% 100%; animation: loader-hop 1.2s cubic-bezier(0.3, 0, 0.3, 1) infinite; }
      #loader .sprigs img:nth-child(2) { animation-delay: 0.15s; }
      #loader .sprigs img:nth-child(3) { animation-delay: 0.3s; }
      #loader h1 { margin: 0; font-family: "IM Fell Double Pica SC", Georgia, serif; font-size: 2.5rem; font-weight: 400; letter-spacing: 0.04em; }
      #loader p { max-width: 18rem; min-height: 3em; margin: 0; color: #676246; font-style: italic; line-height: 1.4; opacity: 0; transition: opacity 0.4s ease; }
      #loader p.shown { opacity: 1; }
      #loader p b { display: block; font-style: normal; font-weight: 400; font-family: "IM Fell Double Pica SC", Georgia, serif; }
      /* Each sprig squashes, jumps and lands, a little after the one before it. */
      @keyframes loader-hop {
        0%, 55%, 100% { transform: translateY(0) scale(1, 1); }
        10% { transform: translateY(0) scale(1.06, 0.9); }
        28% { transform: translateY(-18px) scale(0.96, 1.05) rotate(-3deg); }
        45% { transform: translateY(0) scale(1.04, 0.95); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader .sprigs img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="loader" class="paper" role="status">
      <div class="sprigs" aria-hidden="true">
        <img src="/loader/mustikas.webp" alt="" />
        <img src="/loader/metsmaasikas.webp" alt="" />
        <img src="/loader/pohl.webp" alt="" />
      </div>
      <h1>Korilus</h1>
      <p></p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
